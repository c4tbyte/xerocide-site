<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <div class="top-section">
    <simple-nav
      logo-src="../images/nav-logo.jpg"
      logo-alt="Site"
      logo-href="/"
      links="
        Home|/,
        Shows|/shows,
        Releases|/releases,
        Media|/media,
        About|/about,
        Booking|/booking
      "
      social="
        spotify|https://open.spotify.com/artist/4rYFE3Y8s6AgARellzfzL8?si=zWLyWuRRTFKZ2i-FRKWFdQ,
        instagram|https://www.instagram.com/xerocidefl/,
        email|mailto:booking@xerocide.com
      "
    ></simple-nav>

    <section class="hero">
      <img class="texture texture-left" src="images/texture-left.png" alt="" />
      <img class="texture texture-right" src="images/texture-right.png" alt="" />
      <img class="hero-photo" src="images/hero-image.png" alt="" />
      <img class="hero-badge" src="images/armageddon.png" alt="Armageddon Records" />
      <div class="hero-left">
        <img class="hero-logo" src="images/hero-logo.png" alt="Xerocide" />
        <div class="hero-text">
          <p>TAMPA BAY</p>
          <p>METALLIC HARDCORE.</p>
          <p style="margin-top: 0.5em;" class="hero-text-accent">EST. 2025</p>
        </div>
      </div>
      <div class="hero-right">
        <hero-release
          api-endpoint="/api/serve-release"
          spotify-artist-url="https://open.spotify.com/artist/4rYFE3Y8s6AgARellzfzL8"
        ></hero-release>
      </div>
    </section>
  </div>

  <div class="content-row">
    <div class="row-col">
      <flyer-archive
        api-endpoint="/api/serve-flyers"
        title="Flyer Archive"
        columns="3"
      ></flyer-archive>
    </div>
    <div class="row-divider"></div>
    <div class="row-col">
      <band-merch
        api-endpoint="https://api.bigcartel.com/YOUR_STORE_HANDLE/products.json"
        store-url="https://YOUR_STORE_HANDLE.bigcartel.com"
        match-name="XEROCIDE"
        title="Merch"
        view-all-text="View All Merch"
        view-all-url="https://YOUR_STORE_HANDLE.bigcartel.com"
      ></band-merch>
    </div>
    <div class="row-divider"></div>
    <div class="row-col">
      <video-carousel
        api-endpoint="/api/serve-videos"
        title="Media"
      ></video-carousel>
    </div>
  </div>

<script src="components/helpers/pagination-helper.js"></script>
<script src="components/helpers/resize-helper.js"></script>
<script src="components/helpers/swipe-helper.js"></script>
<script src="components/band-merch.js"></script>
<script src="components/video-carousel.js"></script>
<script src="components/flyer-archive.js"></script>
<script src="components/helpers/text-helper.js"></script>
<script src="components/simple-nav.js"></script>
<script src="components/hero-release.js"></script>
  
</body>
</html>
