<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media — Xerocide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
</head>
<body style="margin:0; background:#0a0a0a;">

<div data-site-nav></div>

<div class="media-banner">
  <h1>MEDIA</h1>
</div>

<style>
  .media-banner {
    position: relative;
    height: 140px;
    background-image: url('/images/xero-albumcover.jpg');
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid #737373;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .media-banner h1 {
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: clamp(48px, 7vw, 80px);
    letter-spacing: 0.02em;
    color: #fff;
    margin: 0;
  }
</style>

<div id="video-gallery" class="vg-root">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap');

    #video-gallery.vg-root {
      --vg-bg: #0a0a0a;
      --vg-white: #f4f4f2;
      --vg-dim: #6b6b68;
      --vg-line: #232320;
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--vg-bg);
      background-image: radial-gradient(rgba(255,255,255,0.035) 0.6px, transparent 0.6px), linear-gradient(rgba(10,10,10,0.6), rgba(10,10,10,0.6)), url('/images/video-bg.png');
      background-size: 3px 3px, cover, cover;
      background-position: center, center, center;
      color: var(--vg-white);
      padding: 32px;
      box-sizing: border-box;
      border: 1px solid #737373;
      margin: 32px 80px;
    }
    #video-gallery .vg-heading {
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      font-size: clamp(36px, 5vw, 56px);
      letter-spacing: 0.01em;
      margin: 0 0 20px 0;
      color: var(--vg-white);
    }
    #video-gallery .vg-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(300px, 1.2fr);
      gap: 40px;
      align-items: stretch;
      height: clamp(360px, 45vh, 520px);
    }
    #video-gallery .vg-list-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    #video-gallery .vg-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #video-gallery .vg-list::-webkit-scrollbar {
      display: none;
    }
    #video-gallery .vg-player-col {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    @media (max-width: 720px) {
      #video-gallery .vg-grid { grid-template-columns: 1fr; }
    }
    #video-gallery .vg-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #video-gallery .vg-list li {
      direction: ltr;
    }
    #video-gallery .vg-item {
      all: unset;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 0 6px 16px;
      border-left: 2px solid transparent;
      color: var(--vg-dim);
      font-size: 16px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transform-origin: left center;
      overflow-wrap: break-word;
      word-break: break-word;
      max-width: 100%;
      direction: ltr;
      text-align: left;
      transition: color 160ms ease, transform 160ms ease, border-color 160ms ease, padding 160ms ease;
    }
    #video-gallery .vg-item:hover,
    #video-gallery .vg-item:focus-visible {
      color: var(--vg-white);
      transform: scale(1.16);
      padding-left: 20px;
    }
    #video-gallery .vg-item:focus-visible {
      outline: 1px dashed var(--vg-white);
      outline-offset: 4px;
    }
    #video-gallery .vg-item.is-selected {
      color: var(--vg-white);
      font-weight: 700;
      border-left-color: var(--vg-white);
    }
    #video-gallery .vg-item-title { line-height: 1.3; }
    #video-gallery .vg-item-meta {
      font-size: 11px;
      color: inherit;
      opacity: 0.6;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    #video-gallery .vg-player {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
      border: 1px solid var(--vg-line);
      overflow: hidden;
    }
    #video-gallery .vg-player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #video-gallery .vg-status {
      font-size: 11px;
      color: var(--vg-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 10px;
    }

    #video-gallery .vg-mobile-heading {
      display: none;
    }

    #video-gallery .vg-mobile-feed {
      display: none;
    }

    @media (max-width: 700px) {
      #video-gallery.vg-root {
        margin: 16px;
        padding: 20px;
      }

      #video-gallery .vg-grid {
        display: none;
      }

      #video-gallery .vg-mobile-heading {
        display: block;
        text-align: center;
      }

      #video-gallery .vg-mobile-feed {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      #video-gallery .vg-mobile-item {
        display: block;
        text-decoration: none;
        color: inherit;
      }

      #video-gallery .vg-mobile-thumb-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid var(--vg-line);
        cursor: pointer;
      }

      #video-gallery .vg-mobile-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      #video-gallery .vg-mobile-play {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--vg-white);
        color: var(--vg-white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        pointer-events: none;
      }

      #video-gallery .vg-mobile-thumb-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #video-gallery .vg-mobile-title {
        margin-top: 10px;
        font-size: 15px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--vg-white);
      }

      #video-gallery .vg-mobile-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--vg-dim);
      }
    }
  </style>

  <div class="vg-grid">
    <div class="vg-list-col">
      <h2 class="vg-heading">VIDEOS</h2>
      <ul class="vg-list" id="vg-list"></ul>
    </div>

    <div class="vg-player-col">
      <div class="vg-player" id="vg-player"></div>
      <p class="vg-status" id="vg-status"></p>
    </div>
  </div>

  <h2 class="vg-heading vg-mobile-heading">VIDEOS</h2>
  <div class="vg-mobile-feed" id="vgMobileFeed"></div>
</div>

<div id="photo-grid" class="pg-root">
  <style>
    #photo-grid.pg-root {
      --pg-bg: #0a0a0a;
      --pg-white: #f4f4f2;
      --pg-dim: #6b6b68;
      font-family: 'JetBrains Mono', monospace;
      background: var(--pg-bg);
      color: var(--pg-white);
      padding: 32px;
      box-sizing: border-box;
      border: 1px solid #737373;
      margin: 0 80px 32px;
      position: relative;
    }
    #photo-grid .pg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    #photo-grid .pg-heading {
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0.01em;
      margin: 0;
      color: var(--pg-white);
    }
    #photo-grid .pg-view-more {
      all: unset;
      position: absolute;
      top: 32px;
      right: 32px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--pg-white);
      border: 1px solid var(--pg-white);
      padding: 10px 18px;
    }
    #photo-grid .pg-view-more:hover {
      background: var(--pg-white);
      color: var(--pg-bg);
    }
    #photo-grid .pg-preview {
      column-count: 6;
      column-gap: 12px;
    }
    #photo-grid .pg-preview img {
      width: 100%;
      display: block;
      margin-bottom: 12px;
      break-inside: avoid;
      background: #111;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      #photo-grid .pg-preview { column-count: 4; }
    }
    @media (max-width: 600px) {
      #photo-grid .pg-preview { column-count: 2; }
    }
    @media (max-width: 700px) {
      #photo-grid.pg-root {
        margin: 16px;
        padding: 20px;
      }
      #photo-grid .pg-header {
        justify-content: center;
      }
      #photo-grid .pg-heading {
        text-align: center;
      }
      #photo-grid .pg-view-more {
        position: static;
        display: block;
        width: fit-content;
        margin: 20px auto 0;
      }
    }
    #photo-grid .pg-status {
      font-size: 13px;
      color: var(--pg-dim);
      text-align: center;
      padding: 20px 0;
    }
    #photo-grid .pg-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      z-index: 999;
      overflow-y: auto;
      padding: 60px 40px;
      box-sizing: border-box;
    }
    #photo-grid .pg-modal[hidden] { display: none; }
    #photo-grid .pg-modal-close {
      all: unset;
      position: fixed;
      top: 20px;
      right: 40px;
      cursor: pointer;
      font-size: 32px;
      line-height: 1;
      color: var(--pg-white);
    }
    #photo-grid .pg-modal-grid {
      column-count: 6;
      column-gap: 12px;
      max-width: 1800px;
      margin: 0 auto;
    }
    #photo-grid .pg-modal-grid img {
      width: 100%;
      display: block;
      margin-bottom: 12px;
      break-inside: avoid;
      background: #111;
    }
    @media (max-width: 1100px) {
      #photo-grid .pg-modal-grid { column-count: 4; }
    }
    @media (max-width: 700px) {
      #photo-grid .pg-modal-grid { column-count: 3; }
    }
  </style>

  <div class="pg-header">
    <h2 class="pg-heading">Photos</h2>
  </div>

  <div class="pg-preview" id="pgPreview">
    <div class="pg-status">Loading photos…</div>
  </div>

  <button class="pg-view-more" id="pgViewMore">View More Photos</button>

  <div class="pg-modal" id="pgModal" hidden>
    <button class="pg-modal-close" id="pgModalClose" aria-label="Close">&times;</button>
    <div class="pg-modal-grid" id="pgModalGrid"></div>
  </div>
</div>

<div data-site-footer></div>

<script src="/components/helpers/text-helper.js"></script>
<script src="/components/simple-nav.js"></script>
<script src="/components/helpers/nav-helper.js"></script>
<script src="/components/simple-footer.js"></script>
<script src="/components/helpers/footer-helper.js"></script>

<script>
(function () {
  var PHOTOS_ENDPOINT = '/api/serve-photos?fresh=1';
  var PREVIEW_COUNT = 12;

  var previewEl = document.getElementById('pgPreview');
  var modalEl = document.getElementById('pgModal');
  var modalGridEl = document.getElementById('pgModalGrid');
  var viewMoreBtn = document.getElementById('pgViewMore');
  var closeBtn = document.getElementById('pgModalClose');

  var allPhotos = [];
  var mobileBatchSize = 12;
  var mobileShownCount = mobileBatchSize;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function isMobile() {
    return window.matchMedia('(max-width: 700px)').matches;
  }

  function renderPreview() {
    if (allPhotos.length === 0) {
      previewEl.innerHTML = '<div class="pg-status">No photos yet.</div>';
      return;
    }
    var visible = isMobile() ? allPhotos.slice(0, mobileShownCount) : allPhotos.slice(0, PREVIEW_COUNT);
    previewEl.innerHTML = visible.map(function (p) {
      return '<img src="' + p.url + '" alt="" loading="lazy" />';
    }).join('');

    if (isMobile()) {
      viewMoreBtn.hidden = mobileShownCount >= allPhotos.length;
    } else {
      viewMoreBtn.hidden = false;
    }
  }

  function renderModalGrid() {
    modalGridEl.innerHTML = allPhotos.map(function (p) {
      return '<img src="' + p.url + '" alt="" loading="lazy" />';
    }).join('');
  }

  viewMoreBtn.addEventListener('click', function () {
    if (isMobile()) {
      mobileShownCount += mobileBatchSize;
      renderPreview();
      return;
    }
    renderModalGrid();
    modalEl.hidden = false;
    document.body.style.overflow = 'hidden';
  });

  closeBtn.addEventListener('click', function () {
    modalEl.hidden = true;
    document.body.style.overflow = '';
  });

  fetch(PHOTOS_ENDPOINT)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      allPhotos = shuffle(Array.isArray(data.photos) ? data.photos : []);
      renderPreview();
    })
    .catch(function () {
      previewEl.innerHTML = '<div class="pg-status">Couldn\'t load photos right now.</div>';
    });
})();
</script>

<script>
(function () {
  var ENDPOINT = '/api/videos?fresh=1';

  var FALLBACK_VIDEOS = [
    { id: '1', title: 'Fear of God Music Video', date: '', location: '', youtubeUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
    { id: '2', title: 'Live in Miami', date: '05/23/2026', location: 'Miami, FL', youtubeUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
  ];

  var listEl = document.getElementById('vg-list');
  var playerEl = document.getElementById('vg-player');
  var statusEl = document.getElementById('vg-status');
  var mobileFeedEl = document.getElementById('vgMobileFeed');

  var autoScrollPaused = false;
  var autoScrollSpeed = 0.3;
  var scrollAccumulator = 0;

  listEl.addEventListener('mouseenter', function () {
    autoScrollPaused = true;
  });

  listEl.addEventListener('mouseleave', function () {
    scrollAccumulator = listEl.scrollTop;
    autoScrollPaused = false;
  });

  function tickAutoScroll() {
    if (!autoScrollPaused) {
      var maxScroll = listEl.scrollHeight - listEl.clientHeight;
      if (maxScroll > 0 && singleSetHeight > 0) {
        scrollAccumulator += autoScrollSpeed;
        if (scrollAccumulator >= singleSetHeight) {
          scrollAccumulator -= singleSetHeight;
        }
        listEl.scrollTop = scrollAccumulator;
      }
    }
    requestAnimationFrame(tickAutoScroll);
  }

  requestAnimationFrame(tickAutoScroll);

  var videos = [];
  var selectedId = null;
  var singleSetHeight = 0;

  function extractYouTubeId(url) {
    if (!url) return null;
    var match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
    return match ? match[1] : null;
  }

  function renderPlayer() {
    var selected = videos.filter(function (v) { return v.id === selectedId; })[0];
    var embedId = selected ? extractYouTubeId(selected.youtubeUrl) : null;

    playerEl.innerHTML = '';
    if (!embedId) return;

    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + embedId;
    iframe.title = selected.title || 'Video';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    playerEl.appendChild(iframe);
  }

  function metaLine(video) {
    return [video.date, video.location].filter(Boolean).join(' · ');
  }

  function buildItem(v) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'vg-item' + (v.id === selectedId ? ' is-selected' : '');
    btn.setAttribute('aria-pressed', v.id === selectedId ? 'true' : 'false');

    var titleSpan = document.createElement('span');
    titleSpan.className = 'vg-item-title';
    titleSpan.textContent = v.title;
    btn.appendChild(titleSpan);

    var meta = metaLine(v);
    if (meta) {
      var metaSpan = document.createElement('span');
      metaSpan.className = 'vg-item-meta';
      metaSpan.textContent = meta;
      btn.appendChild(metaSpan);
    }

    btn.addEventListener('click', function () {
      selectedId = v.id;
      renderList();
      renderPlayer();
    });

    li.appendChild(btn);
    return li;
  }

  function renderMobileFeed() {
    mobileFeedEl.innerHTML = '';
    videos.forEach(function (v) {
      var embedId = extractYouTubeId(v.youtubeUrl);
      if (!embedId) return;

      var item = document.createElement('div');
      item.className = 'vg-mobile-item';

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'vg-mobile-thumb-wrap';

      var thumb = document.createElement('img');
      thumb.className = 'vg-mobile-thumb';
      thumb.src = 'https://img.youtube.com/vi/' + embedId + '/hqdefault.jpg';
      thumb.alt = v.title || '';
      thumb.loading = 'lazy';
      thumbWrap.appendChild(thumb);

      var playBtn = document.createElement('div');
      playBtn.className = 'vg-mobile-play';
      playBtn.textContent = '▶';
      thumbWrap.appendChild(playBtn);

      thumbWrap.addEventListener('click', function () {
        var iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + embedId + '?autoplay=1';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        thumbWrap.innerHTML = '';
        thumbWrap.appendChild(iframe);
      });

      item.appendChild(thumbWrap);

      var title = document.createElement('div');
      title.className = 'vg-mobile-title';
      title.textContent = v.title;
      item.appendChild(title);

      var meta = metaLine(v);
      if (meta) {
        var metaEl = document.createElement('div');
        metaEl.className = 'vg-mobile-meta';
        metaEl.textContent = meta;
        item.appendChild(metaEl);
      }

      mobileFeedEl.appendChild(item);
    });
  }

  function renderList() {
    listEl.innerHTML = '';
    videos.forEach(function (v) {
      listEl.appendChild(buildItem(v));
    });
    singleSetHeight = listEl.scrollHeight;
    videos.forEach(function (v) {
      listEl.appendChild(buildItem(v));
    });
  }

  function setStatus(message) {
    statusEl.textContent = message || '';
  }

  function init(loadedVideos) {
    videos = loadedVideos;
    if (videos.length && !selectedId) {
      selectedId = videos[0].id;
    }
    renderList();
    renderPlayer();
    renderMobileFeed();
  }

  setStatus('Loading videos…');

  fetch(ENDPOINT)
    .then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Request failed: ' + res.status);
        return data;
      });
    })
    .then(function (data) {
      setStatus('');
      init(data.videos || []);
    })
    .catch(function (err) {
      setStatus((err.message || "Couldn't load videos.") + ' Showing sample videos instead.');
      init(FALLBACK_VIDEOS);
    });
})();
</script>

</body>
