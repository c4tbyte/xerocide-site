<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking — Xerocide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .booking-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 160px 24px 100px;
    max-width: 700px;
    margin: 0 auto;
  }

  .booking-page h1 {
    font-size: clamp(40px, 6vw, 64px);
    line-height: 0.95;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0 0 40px;
  }

  .booking-line {
    font-size: 18px;
    line-height: 2;
    color: #b0b0ac;
  }

  .booking-line span {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #fff;
    margin-right: 8px;
  }

  .booking-line a {
    color: inherit;
    text-decoration: none;
  }

  .booking-line a:hover {
    opacity: 0.8;
  }
</style>
</head>
<body style="margin:0; background:#0a0a0a;">

<div data-site-nav></div>

<section class="booking-page">
  <h1>Booking</h1>
  <p class="booking-line"><span>Booking:</span><a href="mailto:booking@xerocide.com">booking@xerocide.com</a></p>
  <p class="booking-line"><span>Instagram:</span><a href="https://www.instagram.com/xerocidefl/" target="_blank" rel="noopener">@xerocidefl</a></p>
</section>

<div data-site-footer></div>

<script src="/components/helpers/text-helper.js"></script>
<script src="/components/simple-nav.js"></script>
<script src="/components/helpers/nav-helper.js"></script>
<script src="/components/simple-footer.js"></script>
<script src="/components/helpers/footer-helper.js"></script>

</body>
</html>
